[package]
name = "sue-paper"
version = "0.1.0"
edition = "2021"
authors = ["SueBwj"]
description = "MattePulp (柔纸): paper-texture overlay"
license = "MIT"
repository = "https://github.com/SueBwj/MattePulp"
readme = "README.md"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
